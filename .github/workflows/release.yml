name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    if: github.repository_owner == 'phibkro'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # changeset status resolves baseBranch "main" as a local ref; PR checkouts only have origin/main.
      - name: Provide local main for changeset status
        run: git rev-parse --verify --quiet refs/heads/main || git branch main refs/remotes/origin/main
      - name: Set up Nix for Alloy
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          set_as_trusted_user: false
      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Set up Node 22 for docs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        uses: ./.github/actions/public-install
      - name: Run stable Effect ordered landing gate
        run: bun run gate

  release:
    needs: release-gate
    if: github.repository_owner == 'phibkro'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Set up npm authentication
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@effx"
      - name: Install dependencies
        uses: ./.github/actions/public-install

      - name: Version and publish packages
        if: env.NPM_TOKEN != ''
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bunx changeset version
          publish-script: bunx changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Skip release until npm credentials are configured
        if: env.NPM_TOKEN == ''
        run: echo 'Release is inactive until the operator configures the NPM_TOKEN Actions secret.'
