name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          bun --bun commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Lint pushed main commit messages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$BEFORE_SHA" == "$zero_sha" ]]; then
            root_commit="$(git rev-list --max-parents=0 "$HEAD_SHA")"
            git show -s --format=%B "$root_commit" | bun --bun commitlint
            if [[ "$root_commit" != "$HEAD_SHA" ]]; then
              bun --bun commitlint --from "$root_commit" --to "$HEAD_SHA" --verbose
            fi
          else
            bun --bun commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi
      - name: Build users example
        run: bun run --cwd examples/users effx:build
      - name: Install rc.116 fixture dependencies
        run: bun install --frozen-lockfile --cwd packages/frontend-ts/test/fixtures/rc116
      - name: Run checks
        run: bun run check
      - name: Run Effect diagnostics
        run: bun run effect:diagnostics
      - name: Typecheck rc.116 fixture
        run: bun run --cwd packages/frontend-ts/test/fixtures/rc116 typecheck
      - name: Pack release artifacts
        run: bun run pack
