name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Set up Node 22 for docs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        uses: ./.github/actions/public-install
      - name: Lint pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          bun --bun commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Lint pushed main commit messages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$BEFORE_SHA" == "$zero_sha" ]]; then
            root_commit="$(git rev-list --max-parents=0 "$HEAD_SHA")"
            git show -s --format=%B "$root_commit" | bun --bun commitlint
            if [[ "$root_commit" != "$HEAD_SHA" ]]; then
              bun --bun commitlint --from "$root_commit" --to "$HEAD_SHA" --verbose
            fi
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            bun --bun commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          else
            echo "Notice: BEFORE_SHA $BEFORE_SHA is unreachable; linting only pushed HEAD commit."
            git show -s --format=%B "$HEAD_SHA" | bun --bun commitlint
          fi
      - name: Run stable Effect ordered landing gate
        run: bun run gate
